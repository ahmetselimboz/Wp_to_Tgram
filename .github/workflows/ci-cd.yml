name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  ci:
    name: Kontrol
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Sözdizimi kontrolü
        run: npm run check

      - name: Docker imajını derle
        run: docker build -t wp-to-tgram:${{ github.sha }} .

  deploy:
    name: VPS'e yayınla
    needs: ci
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.ENABLE_SSH_DEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          passphrase: ${{ secrets.DEPLOY_SSH_PASSPHRASE }}
          port: 2222
          command_timeout: 15m
          script_stop: true
          script: |
            set -euo pipefail
            APP_DIR='${{ secrets.DEPLOY_PATH }}'
            REPO_URL='https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git'
            PUBLIC_URL='https://github.com/${{ github.repository }}.git'
            TELEGRAM_BOT_TOKEN='${{ secrets.TELEGRAM_BOT_TOKEN }}'
            TELEGRAM_CHAT_ID='${{ secrets.TELEGRAM_CHAT_ID }}'

            if [ -z "$APP_DIR" ]; then
              echo 'DEPLOY_PATH secret is empty' >&2
              exit 1
            fi

            mkdir -p "$APP_DIR"
            cd "$APP_DIR"

            if [ ! -d .git ]; then
              git init
              git remote add origin "$REPO_URL"
            fi

            git remote set-url origin "$REPO_URL"
            git fetch origin main
            git checkout -B main origin/main
            git reset --hard origin/main
            git remote set-url origin "$PUBLIC_URL"

            CREATED_ENV=0
            if [ ! -f .env ]; then
              umask 077
              cp .env.example .env
              CREATED_ENV=1
            fi

            if [ "$CREATED_ENV" = 1 ] && [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
              printf 'TELEGRAM_BOT_TOKEN=%s\nTELEGRAM_CHAT_ID=%s\nNOTIFY_DELAY_MS=15000\nLOG_LEVEL=info\n' \
                "$TELEGRAM_BOT_TOKEN" "$TELEGRAM_CHAT_ID" > .env
            fi

            compose() {
              if docker info >/dev/null 2>&1; then
                docker compose -f docker-compose.yml "$@"
              elif sudo -n docker info >/dev/null 2>&1; then
                sudo -n docker compose -f docker-compose.yml "$@"
              else
                echo "Docker izni yok. VPS'te bir kez şunu çalıştır, sonra Actions'ı tekrar çalıştır:"
                echo "  sudo usermod -aG docker \$USER"
                exit 1
              fi
            }

            compose up -d --build --remove-orphans
            compose ps
            docker image prune -f || true
