name: wp-to-tgram

services:
  bridge:
    build:
      context: .
      dockerfile: Dockerfile
    image: wp-to-tgram:latest
    container_name: wp-to-tgram
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    stop_signal: SIGTERM
    env_file:
      - .env
    environment:
      NODE_ENV: production
      AUTH_DIR: /data/auth
      DATA_DIR: /data
      TZ: Europe/Istanbul
    volumes:
      - wp_data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  wp_data:
    name: wp-to-tgram-data
