services:
  bridge:
    build: .
    container_name: wp-to-tgram
    restart: unless-stopped
    stop_grace_period: 30s
    stop_signal: SIGTERM
    env_file:
      - .env
    volumes:
      - wp_data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  wp_data:
